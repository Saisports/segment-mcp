[project]
name = "segment-mcp"
version = "0.1.0"
description = "MCP server for the Twilio Segment Public API (read-first)"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2,<2", "httpx>=0.27"]

[project.scripts]
segment-mcp = "segment_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/segment_mcp"]
